services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?defina um segredo em .env}
      JWT_PARTICIPANT_SECRET: ${JWT_PARTICIPANT_SECRET:?defina um segredo em .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina uma senha em .env}
      DB_PATH: /app/data/trivia.db
    volumes:
      - trivia_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  trivia_data:
